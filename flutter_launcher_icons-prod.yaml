# === Run to generate app icons ===========================================
# dart run flutter_launcher_icons

flutter_launcher_icons:

  # === Android Setup =========================================================
  android: true
  image_path_android: 'assets/icons/app_icon.png'
  adaptive_icon_foreground: 'assets/icons/logo_red_large.png'
  adaptive_icon_background: '#000000'
  adaptive_icon_foreground_inset: 10


  # === iOS Setup =========================================================
  ios: true
  remove_alpha_ios: true
  desaturate_tinted_to_grayscale_ios: false
  image_path_ios: 'assets/icons/app_icon.png'