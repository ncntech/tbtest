name: Release Bot

on:
  push:
    tags:
      - "v*"

jobs:
  build_android:
    name: Build Android Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: "stable"
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localization files
        run: |
          mkdir -p lib/presentation/shared/localization
          dart run easy_localization:generate \
            -S assets/translations \
            -f codegen_loader \
            -o codegen_loader.g.dart \
            --output-dir lib/presentation/shared/localization
          dart run easy_localization:generate \
            -S assets/translations \
            -f keys \
            -o locale_keys.g.dart \
            --output-dir lib/presentation/shared/localization

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build release AAB
        run: flutter build appbundle --release --flavor prod -t lib/main_prod.dart

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: nasmotives-release-aab
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build_android]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: nasmotives-release-aab
          path: ./artifacts

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "NasMotives ${{ github.ref_name }}"
          body: |
            ## NasMotives ${{ github.ref_name }}

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Install
            Download the `.aab` for Play Store submission or use the debug APK from CI artifacts.
          files: |
            ./artifacts/app-prod-release.aab
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
